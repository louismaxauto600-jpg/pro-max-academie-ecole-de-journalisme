const root=document.getElementById("pma-course02");
if(!root)return;

let language="fr";
const saved=localStorage.getItem("pma-c02-language");
if(DATA[saved])language=saved;

const $=id=>document.getElementById(id);

function make(tag,text){
const el=document.createElement(tag);
el.textContent=text;
return el;
}

function render(){
const d=DATA[language];
$("c02-title").textContent=d.title;
$("c02-intro").textContent=d.intro;
$("c02-exam-title").textContent=d.exam;
$("c02-exam-intro").textContent=d.instructions;
$("c02-grade").textContent=d.grade;
$("c02-reset").textContent=d.reset;

root.querySelectorAll("[data-c02-lang]").forEach(b=>{
b.setAttribute("aria-pressed",
 String(b.dataset.c02Lang===language));
});

const lessons=$("c02-lessons");
lessons.replaceChildren();

d.lessons.forEach((lesson,i)=>{
const details=document.createElement("details");
details.className="c02-card";
const summary=make("summary",lesson.title);
details.append(summary);

lesson.body.forEach(paragraph=>{
details.append(make("p",paragraph));
});

details.append(make("h3",d.exercise));
details.append(make("p",lesson.task));
const response=document.createElement("textarea");
response.rows=4;
response.style.cssText=
"width:100%;background:#100603;color:#ffb36b;"+
"border:1px solid #ff8200;border-radius:8px;padding:12px;";
response.setAttribute("aria-label",d.exercise+" "+(i+1));
details.append(response);
lessons.append(details);
});

const exam=$("c02-exam");
exam.replaceChildren();

d.questions.forEach((q,i)=>{
const block=document.createElement("fieldset");
block.className="c02-question";
block.style.border="0";
block.style.margin="0";
block.style.padding="16px 0";
block.append(make("legend",(i+1)+". "+q[0]));

q[1].forEach((answer,j)=>{
const label=document.createElement("label");
const radio=document.createElement("input");
radio.type="radio";
radio.name="c02-q"+i;
radio.value=String(j);
radio.style.marginRight="10px";
label.append(radio,document.createTextNode(answer));
block.append(label);
});
exam.append(block);
});

$("c02-result").textContent="";
}

function setLanguage(lang){
if(!DATA[lang])return;
language=lang;
localStorage.setItem("pma-c02-language",lang);
render();
}

root.querySelectorAll("[data-c02-lang]").forEach(b=>{
b.addEventListener("click",()=>setLanguage(b.dataset.c02Lang));
});

$("c02-grade").addEventListener("click",()=>{
const d=DATA[language];
let score=0;

for(let i=0;i<d.questions.length;i++){
const chosen=root.querySelector(
'input[name="c02-q'+i+'"]:checked'
);
if(!chosen){
$("c02-result").textContent=d.incomplete;
return;
}
if(Number(chosen.value)===d.questions[i][2])score+=10;
}

$("c02-result").textContent=
score+"/100 — "+(score>=70?d.passed:d.failed);
});

$("c02-reset").addEventListener("click",render);

/* Synchronise Course 02 with existing language buttons.
   Does not replace existing site handlers. */
document.addEventListener("click",event=>{
const button=event.target.closest("button");
if(!button||root.contains(button))return;
const label=button.textContent.trim().toUpperCase();
const langMap={
"KRE":"ht","HT":"ht",
"FRA":"fr","FR":"fr",
"ENG":"en","EN":"en"
};
if(langMap[label])setLanguage(langMap[label]);
});

render();
})();
