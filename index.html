<style>
:root{
 --orange:#ff7900;--apricot:#ffb16a;
 --black:#100602;--panel:#260d05;
 --line:#9a4822;--text:#ffcc9e
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:145px}
body{
 margin:0;font-family:Arial,sans-serif;color:var(--text);
 background:linear-gradient(115deg,#100602,#5a1b09 45%,#100602)
}
header{
 position:sticky;top:0;z-index:50;
 background:#100602f5;border-bottom:2px solid var(--orange)
}
.header-inner,.container{max-width:1160px;margin:auto;padding:16px}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;color:var(--orange);font-weight:900}
.logo{width:65px;height:65px;object-fit:contain;border:2px solid var(--orange);border-radius:50%}
nav{display:flex;flex-wrap:wrap;gap:13px}
nav a{color:var(--text);font-size:13px;text-decoration:none;font-weight:bold}
.lang{display:flex;gap:5px}
button,.btn{
 background:var(--orange);color:#100602;border:2px solid var(--orange);
 border-radius:10px;padding:12px 17px;font-weight:900;
 cursor:pointer;text-decoration:none;font-family:inherit
}
.lang button{padding:9px 11px;background:transparent;color:var(--apricot)}
.lang button.active{background:var(--orange);color:#100602}
button:hover,.btn:hover{filter:brightness(1.12)}
section{padding:55px 0;border-bottom:1px solid #8b381b}
h1,h2,h3{color:var(--orange)}
h1{font-size:clamp(35px,6vw,65px);margin:12px 0}
h2{text-align:center;font-size:clamp(23px,4vw,32px)}
p{line-height:1.65}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}
.card,.lesson,.exam{
 background:linear-gradient(145deg,#290e05,#120603);
 border:1px solid var(--line);border-radius:18px;padding:25px
}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.media{width:100%;border-radius:14px;border:2px solid var(--orange);object-fit:contain}
.video-box{background:#100602;border:2px solid var(--orange);border-radius:16px;padding:16px;text-align:center}
.video-box video{width:100%;max-height:390px;border-radius:12px}
.course{margin:25px 0}
.lesson{margin:12px 0}
summary{cursor:pointer;color:var(--orange);font-size:19px;font-weight:900}
.lesson-body{padding-top:15px}
.exercise{padding:15px;border-left:4px solid var(--orange);background:#3b1709;margin-top:18px}
.exam{margin-top:25px}
.question{padding:15px 0;border-bottom:1px solid var(--line)}
.question label{display:block;padding:8px;cursor:pointer}
input[type=radio]{accent-color:var(--orange)}
input:not([type=radio]),select,textarea{
 width:100%;background:#100602;border:1px solid var(--orange);
 border-radius:9px;padding:13px;color:var(--text);font:inherit
}
textarea{min-height:95px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field label{display:block;margin-bottom:7px;font-weight:bold}
.socials{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.social{
 display:flex;flex-direction:column;align-items:center;gap:9px;
 border:2px solid currentColor;border-radius:12px;
 padding:15px 6px;text-decoration:none;font-weight:bold
}
.social svg{width:29px;height:29px;fill:currentColor}
.contacts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.contacts a{border:1px solid var(--line);border-radius:10px;padding:15px;text-align:center;color:var(--text);text-decoration:none}
footer{text-align:center;padding:35px;border-top:2px solid var(--orange)}
.status{margin-top:12px;color:var(--orange);font-weight:bold}
@media(max-width:800px){
 .hero,.grid,.form-grid{grid-template-columns:1fr}
 .socials{grid-template-columns:repeat(2,1fr)}
 .contacts{grid-template-columns:1fr}
 .header-inner{justify-content:center}
 nav{justify-content:center}
 section{padding:30px 0}
}
</style>
</head>

/* LANGUAGE ENGINE */
let currentLanguage="fr";
const langIndex={fr:0,en:1,ht:2};

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}

function setLanguage(lang){
 if(!T[lang])return;
 currentLanguage=lang;
 document.documentElement.lang=lang;
 localStorage.setItem("promax-language",lang);

 document.querySelectorAll("[data-i]").forEach(el=>{
  const key=el.dataset.i;
  if(T[lang][key]!==undefined)el.textContent=T[lang][key];
 });

 document.querySelectorAll("[data-lang]").forEach(btn=>{
  const active=btn.dataset.lang===lang;
  btn.classList.toggle("active",active);
  btn.setAttribute("aria-pressed",String(active));
 });

 renderCourses();
}

document.querySelectorAll("[data-lang]").forEach(btn=>{
 btn.addEventListener("click",()=>setLanguage(btn.dataset.lang));
});

/* COURSES + LESSONS + EXAMS */
function renderCourses(){
 const index=langIndex[currentLanguage];
 const tr=T[currentLanguage];
 const root=document.getElementById("courseContainer");

 root.innerHTML=courses.map((course,ci)=>`
 <article class="course">
  <h2>${esc(course.title[currentLanguage])}</h2>
  ${course.lessons.map((lesson,li)=>`
   <details class="lesson">
    <summary>${tr.lesson} ${li+1} — ${esc(lesson.title[index])}</summary>
    <div class="lesson-body">
     <p>${esc(lesson.body[index])}</p>
     <div class="exercise">
      <strong>${tr.exercise} ${li+1}</strong>
      <p>${esc(lesson.exercise[index])}</p>
      <textarea aria-label="${tr.exercise} ${li+1}"></textarea>
     </div>
    </div>
   </details>
  `).join("")}
  <div class="exam">
   <h2>${tr.exam} — ${ci+1}</h2>
   <p>10 × 10 = 100 | 70% minimum</p>
   <form id="exam${ci}" onsubmit="gradeExam(event,${ci})">
   ${course.questions.map((item,qi)=>`
    <div class="question">
     <h3>${qi+1}. ${esc(item.q[index])}</h3>
     ${item.a[index].map((answer,ai)=>`
      <label>
       <input type="radio" name="q${qi}" value="${ai}">
       ${esc(answer)}
      </label>
     `).join("")}
    </div>
   `).join("")}
   <p>
    <button type="submit">${tr.submit}</button>
    <button type="reset">${tr.reset}</button>
   </p>
   <div id="result${ci}" class="status" aria-live="polite"></div>
   </form>
  </div>
 </article>
 `).join("");
}

function gradeExam(event,ci){
 event.preventDefault();
 const form=event.currentTarget;
 const questions=courses[ci].questions;
 let score=0;

 for(let i=0;i<questions.length;i++){
  const selected=form.querySelector(
   'input[name="q'+i+'"]:checked'
  );
  if(!selected){
   document.getElementById("result"+ci).textContent=
    T[currentLanguage].required;
   return;
  }
  if(Number(selected.value)===questions[i].correct)score+=10;
 }

 const tr=T[currentLanguage];
 document.getElementById("result"+ci).textContent=
  tr.score+": "+score+"/100 — "+(score>=70?tr.pass:tr.fail);
}

document.getElementById("registrationForm")
.addEventListener("submit",event=>{
 event.preventDefault();
 document.getElementById("registrationStatus").textContent=
  T[currentLanguage].registrationReady;
});
